<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="mark">B</span>
      <span class="name">Badem CRM</span>
    </div>

    <nav>
      @for (item of nav(); track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active">{{ item.label }}</a>
      }
    </nav>

    <div class="sidebar-foot">
      <a routerLink="/account" routerLinkActive="active">My account</a>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="user">
        <span class="avatar">{{ initials() }}</span>
        <div class="who">
          <strong>{{ auth.user()?.fullName }}</strong>
          <span class="badge green">{{ auth.user()?.role }}</span>
        </div>
      </div>
      <button type="button" class="btn ghost small" (click)="logout()">Log out</button>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
