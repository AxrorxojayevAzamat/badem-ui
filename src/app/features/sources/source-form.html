<div class="page">
  <div class="page-head">
    <div>
      <h1>{{ isEdit() ? 'Edit source' : 'New source' }}</h1>
      <p class="subtitle">
        A source is raw material bought from one supplier and consumed by products.
      </p>
    </div>
  </div>

  @if (loading()) {
    <div class="card"><p class="empty">Loading source…</p></div>
  } @else {
    <form class="card" [formRoot]="sourceForm">
      <form-error [form]="sourceForm" />

      <div class="form-grid">
        <div class="field">
          <label for="name">Name</label>
          <input id="name" [formField]="sourceForm.name" placeholder="Raw almond" />
          <field-errors [field]="sourceForm.name" />
        </div>

        <div class="field">
          <label for="supplierId">Supplier</label>
          <select id="supplierId" [formField]="sourceForm.supplierId">
            <option value="">Select a supplier…</option>
            @for (supplier of suppliers(); track supplier.id) {
              <option [value]="supplier.id">{{ supplier.name }}</option>
            }
          </select>
          <field-errors [field]="sourceForm.supplierId" />
        </div>

        <div class="field">
          <label for="unit">Unit</label>
          <input id="unit" [formField]="sourceForm.unit" placeholder="kg" />
          <field-errors [field]="sourceForm.unit" />
        </div>

        <div class="field">
          <label for="quantity">Opening stock</label>
          <input id="quantity" type="number" step="0.001" [formField]="sourceForm.quantity" />
          @if (quantityDisabledReason(); as reason) {
            <p class="hint">{{ reason }}</p>
          } @else {
            <p class="hint">Logged as a RESTOCK entry when greater than zero.</p>
          }
          <field-errors [field]="sourceForm.quantity" />
        </div>

        <div class="field">
          <label for="minQuantity">Low-stock threshold</label>
          <input id="minQuantity" type="number" step="0.001" [formField]="sourceForm.minQuantity" />
          <field-errors [field]="sourceForm.minQuantity" />
        </div>

        <div class="field">
          <label for="pricePerUnit">Price per unit</label>
          <input id="pricePerUnit" type="number" step="0.01" [formField]="sourceForm.pricePerUnit" />
          <field-errors [field]="sourceForm.pricePerUnit" />
        </div>

        <div class="field full">
          <label for="description">Description</label>
          <input id="description" [formField]="sourceForm.description" />
          <field-errors [field]="sourceForm.description" />
        </div>

        <div class="field">
          <label for="isActive">Status</label>
          <label class="checkbox">
            <input id="isActive" type="checkbox" [formField]="sourceForm.isActive" />
            <span>Active source</span>
          </label>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn" [disabled]="sourceForm().submitting()">
          {{ sourceForm().submitting() ? 'Saving…' : isEdit() ? 'Save changes' : 'Create source' }}
        </button>
        <button type="button" class="btn ghost" (click)="cancel()">Cancel</button>
      </div>
    </form>
  }
</div>
