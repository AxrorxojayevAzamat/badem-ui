<div class="page">
  <div class="page-head">
    <div>
      <h1>{{ isEdit() ? 'Edit supplier' : 'New supplier' }}</h1>
      <p class="subtitle">Suppliers own the sources you buy raw material from.</p>
    </div>
  </div>

  @if (loading()) {
    <div class="card"><p class="empty">Loading supplier…</p></div>
  } @else {
    <form class="card" [formRoot]="supplierForm">
      <form-error [form]="supplierForm" />

      <div class="form-grid">
        <div class="field full">
          <label for="name">Name</label>
          <input id="name" [formField]="supplierForm.name" placeholder="Almond Import LLC" />
          <field-errors [field]="supplierForm.name" />
        </div>

        <div class="field">
          <label for="phone">Phone</label>
          <input id="phone" [formField]="supplierForm.phone" placeholder="+998712000000" />
          <field-errors [field]="supplierForm.phone" />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            [formField]="supplierForm.email"
            placeholder="sales@example.uz"
          />
          <field-errors [field]="supplierForm.email" />
        </div>

        <div class="field">
          <label for="taxNumber">Tax number</label>
          <input id="taxNumber" [formField]="supplierForm.taxNumber" />
          <field-errors [field]="supplierForm.taxNumber" />
        </div>

        <div class="field">
          <label for="isActive">Status</label>
          <label class="checkbox">
            <input id="isActive" type="checkbox" [formField]="supplierForm.isActive" />
            <span>Active supplier</span>
          </label>
        </div>

        <div class="field full">
          <label for="address">Address</label>
          <input id="address" [formField]="supplierForm.address" />
          <field-errors [field]="supplierForm.address" />
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn" [disabled]="supplierForm().submitting()">
          {{ supplierForm().submitting() ? 'Saving…' : isEdit() ? 'Save changes' : 'Create supplier' }}
        </button>
        <button type="button" class="btn ghost" (click)="cancel()">Cancel</button>
      </div>
    </form>
  }
</div>
