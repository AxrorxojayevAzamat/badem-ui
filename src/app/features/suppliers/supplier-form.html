<div class="page">
  <div class="page-head">
    <div>
      <h1>{{ isEdit() ? i18n.t('supplierForm.titleEdit') : i18n.t('supplierForm.titleNew') }}</h1>
      <p class="subtitle">{{ i18n.t('supplierForm.subtitle') }}</p>
    </div>
  </div>

  @if (loading()) {
    <div class="card"><p class="empty">{{ i18n.t('supplierForm.loading') }}</p></div>
  } @else {
    <form class="card" [formRoot]="supplierForm">
      <form-error [form]="supplierForm" />

      <div class="form-grid">
        <div class="field full">
          <label for="name">{{ i18n.t('common.name') }}</label>
          <input id="name" [formField]="supplierForm.name" placeholder="Almond Import LLC" />
          <field-errors [field]="supplierForm.name" />
        </div>

        <div class="field">
          <label for="phone">{{ i18n.t('common.phone') }}</label>
          <input id="phone" [formField]="supplierForm.phone" placeholder="+998712000000" />
          <field-errors [field]="supplierForm.phone" />
        </div>

        <div class="field">
          <label for="email">{{ i18n.t('common.email') }}</label>
          <input
            id="email"
            type="email"
            [formField]="supplierForm.email"
            placeholder="sales@example.uz"
          />
          <field-errors [field]="supplierForm.email" />
        </div>

        <div class="field">
          <label for="taxNumber">{{ i18n.t('suppliers.taxNumber') }}</label>
          <input id="taxNumber" [formField]="supplierForm.taxNumber" />
          <field-errors [field]="supplierForm.taxNumber" />
        </div>

        <div class="field">
          <label for="isActive">{{ i18n.t('common.status') }}</label>
          <label class="checkbox">
            <input id="isActive" type="checkbox" [formField]="supplierForm.isActive" />
            <span>{{ i18n.t('supplierForm.activeSupplier') }}</span>
          </label>
        </div>

        <div class="field full">
          <label for="address">{{ i18n.t('common.address') }}</label>
          <input id="address" [formField]="supplierForm.address" />
          <field-errors [field]="supplierForm.address" />
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn" [disabled]="supplierForm().submitting()">
          {{
            supplierForm().submitting()
              ? i18n.t('common.saving')
              : isEdit()
                ? i18n.t('common.save')
                : i18n.t('supplierForm.submit')
          }}
        </button>
        <button type="button" class="btn ghost" (click)="cancel()">
          {{ i18n.t('common.cancel') }}
        </button>
      </div>
    </form>
  }
</div>
