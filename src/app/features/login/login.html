<div class="login-page">
  <form class="card login-card" [formRoot]="loginForm">
    <div class="head">
      <span class="mark">B</span>
      <h1>{{ i18n.t('common.appName') }}</h1>
      <p class="muted">{{ i18n.t('auth.subtitle') }}</p>
    </div>

    @if (serverError(); as message) {
      <div class="alert error">{{ message }}</div>
    }

    <div class="field">
      <label for="email">{{ i18n.t('common.email') }}</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        placeholder="admin@badem.local"
        [formField]="loginForm.email"
      />
      <field-errors [field]="loginForm.email" />
    </div>

    <div class="field">
      <label for="password">{{ i18n.t('auth.password') }}</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        [formField]="loginForm.password"
      />
      <field-errors [field]="loginForm.password" />
    </div>

    <button type="submit" class="btn" [disabled]="loginForm().submitting()">
      {{ loginForm().submitting() ? i18n.t('auth.signingIn') : i18n.t('auth.signIn') }}
    </button>

    <div class="lang-row">
      @for (language of i18n.languages; track language.code) {
        <button
          type="button"
          class="lang-btn"
          [class.active]="i18n.lang() === language.code"
          (click)="i18n.setLang(language.code)"
        >
          {{ language.label }}
        </button>
      }
    </div>

    <p class="hint muted">
      {{ i18n.t('auth.seeded') }} <code>admin&#64;badem.local</code> / <code>Admin123!</code>
    </p>
  </form>
</div>
