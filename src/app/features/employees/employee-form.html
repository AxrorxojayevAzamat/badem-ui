<div class="page">
  <div class="page-head">
    <div>
      <h1>{{ isEdit() ? 'Edit employee' : 'New employee' }}</h1>
      <p class="subtitle">A login account may back at most one employee record.</p>
    </div>
  </div>

  @if (loading()) {
    <div class="card"><p class="empty">Loading employee…</p></div>
  } @else {
    <form class="card" [formRoot]="employeeForm">
      <form-error [form]="employeeForm" />

      <div class="form-grid">
        <div class="field">
          <label for="fullName">Full name</label>
          <input id="fullName" [formField]="employeeForm.fullName" placeholder="Dilshod Karimov" />
          <field-errors [field]="employeeForm.fullName" />
        </div>

        <div class="field">
          <label for="position">Position</label>
          <input id="position" [formField]="employeeForm.position" placeholder="Warehouse manager" />
          <field-errors [field]="employeeForm.position" />
        </div>

        <div class="field">
          <label for="phone">Phone</label>
          <input id="phone" [formField]="employeeForm.phone" placeholder="+998901234567" />
          <field-errors [field]="employeeForm.phone" />
        </div>

        <div class="field">
          <label for="salary">Salary</label>
          <input id="salary" type="number" step="0.01" [formField]="employeeForm.salary" />
          <field-errors [field]="employeeForm.salary" />
        </div>

        <div class="field">
          <label for="hiredAt">Hired on</label>
          <input id="hiredAt" type="date" [formField]="employeeForm.hiredAt" />
          <field-errors [field]="employeeForm.hiredAt" />
        </div>

        <div class="field">
          <label for="userId">Login account</label>
          <select id="userId" [formField]="employeeForm.userId">
            <option value="">No login account</option>
            @for (user of users(); track user.id) {
              <option [value]="user.id">{{ user.fullName }} — {{ user.email }}</option>
            }
          </select>
          <field-errors [field]="employeeForm.userId" />
        </div>

        <div class="field full">
          <label for="address">Address</label>
          <input id="address" [formField]="employeeForm.address" />
          <field-errors [field]="employeeForm.address" />
        </div>

        <div class="field">
          <label for="isActive">Status</label>
          <label class="checkbox">
            <input id="isActive" type="checkbox" [formField]="employeeForm.isActive" />
            <span>Currently employed</span>
          </label>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn" [disabled]="employeeForm().submitting()">
          {{ employeeForm().submitting() ? 'Saving…' : isEdit() ? 'Save changes' : 'Create employee' }}
        </button>
        <button type="button" class="btn ghost" (click)="cancel()">Cancel</button>
      </div>
    </form>
  }
</div>
