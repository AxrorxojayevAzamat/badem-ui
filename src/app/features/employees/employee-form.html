<div class="page">
  <div class="page-head">
    <div>
      <h1>{{ isEdit() ? i18n.t('employeeForm.titleEdit') : i18n.t('employeeForm.titleNew') }}</h1>
      <p class="subtitle">{{ i18n.t('employeeForm.subtitle') }}</p>
    </div>
  </div>

  @if (loading()) {
    <div class="card"><p class="empty">{{ i18n.t('employeeForm.loading') }}</p></div>
  } @else {
    <form class="card" [formRoot]="employeeForm">
      <form-error [form]="employeeForm" />

      <div class="form-grid">
        <div class="field">
          <label for="fullName">{{ i18n.t('common.fullName') }}</label>
          <input id="fullName" [formField]="employeeForm.fullName" placeholder="Dilshod Karimov" />
          <field-errors [field]="employeeForm.fullName" />
        </div>

        <div class="field">
          <label for="position">{{ i18n.t('employeeForm.position') }}</label>
          <input id="position" [formField]="employeeForm.position" />
          <field-errors [field]="employeeForm.position" />
        </div>

        <div class="field">
          <label for="phone">{{ i18n.t('common.phone') }}</label>
          <input id="phone" [formField]="employeeForm.phone" placeholder="+998901234567" />
          <field-errors [field]="employeeForm.phone" />
        </div>

        <div class="field">
          <label for="salary">{{ i18n.t('employeeForm.salary') }}</label>
          <input id="salary" type="number" step="0.01" [formField]="employeeForm.salary" />
          <field-errors [field]="employeeForm.salary" />
        </div>

        <div class="field">
          <label for="hiredAt">{{ i18n.t('employeeForm.hiredAt') }}</label>
          <input id="hiredAt" type="date" [formField]="employeeForm.hiredAt" />
          <field-errors [field]="employeeForm.hiredAt" />
        </div>

        <div class="field">
          <label for="userId">{{ i18n.t('employeeForm.loginAccount') }}</label>
          <select id="userId" [formField]="employeeForm.userId">
            <option value="">{{ i18n.t('employeeForm.noLogin') }}</option>
            @for (user of users(); track user.id) {
              <option [value]="user.id">{{ user.fullName }} — {{ user.email }}</option>
            }
          </select>
          <field-errors [field]="employeeForm.userId" />
        </div>

        <div class="field full">
          <label for="address">{{ i18n.t('common.address') }}</label>
          <input id="address" [formField]="employeeForm.address" />
          <field-errors [field]="employeeForm.address" />
        </div>

        <div class="field">
          <label for="isActive">{{ i18n.t('common.status') }}</label>
          <label class="checkbox">
            <input id="isActive" type="checkbox" [formField]="employeeForm.isActive" />
            <span>{{ i18n.t('employeeForm.employed') }}</span>
          </label>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn" [disabled]="employeeForm().submitting()">
          {{
            employeeForm().submitting()
              ? i18n.t('common.saving')
              : isEdit()
                ? i18n.t('common.save')
                : i18n.t('employeeForm.submit')
          }}
        </button>
        <button type="button" class="btn ghost" (click)="cancel()">
          {{ i18n.t('common.cancel') }}
        </button>
      </div>
    </form>
  }
</div>
