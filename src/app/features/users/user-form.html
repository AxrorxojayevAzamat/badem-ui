<div class="page">
  <div class="page-head">
    <div>
      <h1>{{ i18n.t('userForm.title') }}</h1>
      <p class="subtitle">{{ i18n.t('userForm.subtitle') }}</p>
    </div>
  </div>

  <form class="card" [formRoot]="userForm">
    <form-error [form]="userForm" />

    <div class="form-grid">
      <div class="field">
        <label for="fullName">{{ i18n.t('common.fullName') }}</label>
        <input id="fullName" [formField]="userForm.fullName" />
        <field-errors [field]="userForm.fullName" />
      </div>

      <div class="field">
        <label for="email">{{ i18n.t('common.email') }}</label>
        <input id="email" type="email" autocomplete="off" [formField]="userForm.email" />
        <field-errors [field]="userForm.email" />
      </div>

      <div class="field">
        <label for="password">{{ i18n.t('userForm.password') }}</label>
        <input
          id="password"
          type="password"
          autocomplete="new-password"
          [formField]="userForm.password"
        />
        <field-errors [field]="userForm.password" />
      </div>

      <div class="field">
        <label for="role">{{ i18n.t('userForm.role') }}</label>
        <select id="role" [formField]="userForm.role">
          @for (role of roles; track role) {
            <option [value]="role">{{ role }}</option>
          }
        </select>
        <field-errors [field]="userForm.role" />
      </div>

      <div class="field">
        <label for="isActive">{{ i18n.t('common.status') }}</label>
        <label class="checkbox">
          <input id="isActive" type="checkbox" [formField]="userForm.isActive" />
          <span>{{ i18n.t('userForm.accountEnabled') }}</span>
        </label>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn" [disabled]="userForm().submitting()">
        {{ userForm().submitting() ? i18n.t('userForm.creating') : i18n.t('userForm.submit') }}
      </button>
      <button type="button" class="btn ghost" (click)="cancel()">
        {{ i18n.t('common.cancel') }}
      </button>
    </div>
  </form>
</div>
