<div class="page">
  <div class="page-head">
    <div>
      <h1>My account</h1>
      <p class="subtitle">Your profile and password.</p>
    </div>
  </div>

  @if (auth.user(); as user) {
    <div class="card">
      <div class="card-head"><h2>Profile</h2></div>
      <div class="form-grid">
        <div class="field">
          <label>Name</label>
          <strong>{{ user.fullName }}</strong>
        </div>
        <div class="field">
          <label>Email</label>
          <strong>{{ user.email }}</strong>
        </div>
        <div class="field">
          <label>Role</label>
          <span><span class="badge green">{{ user.role }}</span></span>
        </div>
        <div class="field">
          <label>Last login</label>
          <strong>
            {{ user.lastLoginAt ? (user.lastLoginAt | date: 'dd MMM yyyy, HH:mm') : '—' }}
          </strong>
        </div>
      </div>
    </div>
  }

  <form class="card" [formRoot]="passwordForm">
    <div class="card-head"><h2>Change password</h2></div>
    <form-error [form]="passwordForm" />

    <div class="form-grid">
      <div class="field">
        <label for="currentPassword">Current password</label>
        <input
          id="currentPassword"
          type="password"
          autocomplete="current-password"
          [formField]="passwordForm.currentPassword"
        />
        <field-errors [field]="passwordForm.currentPassword" />
      </div>

      <div class="field">
        <label for="newPassword">New password</label>
        <input
          id="newPassword"
          type="password"
          autocomplete="new-password"
          [formField]="passwordForm.newPassword"
        />
        <field-errors [field]="passwordForm.newPassword" />
      </div>

      <div class="field">
        <label for="confirmPassword">Repeat new password</label>
        <input
          id="confirmPassword"
          type="password"
          autocomplete="new-password"
          [formField]="passwordForm.confirmPassword"
        />
        <field-errors [field]="passwordForm.confirmPassword" />
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn" [disabled]="passwordForm().submitting()">
        {{ passwordForm().submitting() ? 'Saving…' : 'Change password' }}
      </button>
      <span class="muted">Changing it signs you out of all sessions.</span>
    </div>
  </form>
</div>
