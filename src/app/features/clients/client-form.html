<div class="page">
  <div class="page-head">
    <div>
      <h1>{{ isEdit() ? i18n.t('clientForm.titleEdit') : i18n.t('clientForm.titleNew') }}</h1>
      <p class="subtitle">{{ i18n.t('clientForm.subtitle') }}</p>
    </div>
  </div>

  @if (loading()) {
    <div class="card"><p class="empty">{{ i18n.t('clientForm.loading') }}</p></div>
  } @else {
    <form class="card" [formRoot]="clientForm">
      <form-error [form]="clientForm" />

      <div class="form-grid">
        <div class="field">
          <label for="name">{{ i18n.t('common.name') }}</label>
          <input id="name" [formField]="clientForm.name" placeholder="Korzinka Supermarket" />
          <field-errors [field]="clientForm.name" />
        </div>

        <div class="field">
          <label for="company">{{ i18n.t('common.company') }}</label>
          <input id="company" [formField]="clientForm.company" placeholder="Korzinka LLC" />
          <field-errors [field]="clientForm.company" />
        </div>

        <div class="field">
          <label for="phone">{{ i18n.t('common.phone') }}</label>
          <input id="phone" [formField]="clientForm.phone" placeholder="+998901112233" />
          <field-errors [field]="clientForm.phone" />
        </div>

        <div class="field">
          <label for="email">{{ i18n.t('common.email') }}</label>
          <input id="email" type="email" [formField]="clientForm.email" />
          <field-errors [field]="clientForm.email" />
        </div>

        <div class="field full">
          <label for="address">{{ i18n.t('common.address') }}</label>
          <input id="address" [formField]="clientForm.address" />
          <field-errors [field]="clientForm.address" />
        </div>

        <div class="field">
          <label for="isActive">{{ i18n.t('common.status') }}</label>
          <label class="checkbox">
            <input id="isActive" type="checkbox" [formField]="clientForm.isActive" />
            <span>{{ i18n.t('clientForm.activeClient') }}</span>
          </label>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn" [disabled]="clientForm().submitting()">
          {{
            clientForm().submitting()
              ? i18n.t('common.saving')
              : isEdit()
                ? i18n.t('common.save')
                : i18n.t('clientForm.submit')
          }}
        </button>
        <button type="button" class="btn ghost" (click)="cancel()">
          {{ i18n.t('common.cancel') }}
        </button>
      </div>
    </form>
  }
</div>
