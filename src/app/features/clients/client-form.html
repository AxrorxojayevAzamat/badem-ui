<div class="page">
  <div class="page-head">
    <div>
      <h1>{{ isEdit() ? 'Edit client' : 'New client' }}</h1>
      <p class="subtitle">Clients are who you produce for.</p>
    </div>
  </div>

  @if (loading()) {
    <div class="card"><p class="empty">Loading client…</p></div>
  } @else {
    <form class="card" [formRoot]="clientForm">
      <form-error [form]="clientForm" />

      <div class="form-grid">
        <div class="field">
          <label for="name">Name</label>
          <input id="name" [formField]="clientForm.name" placeholder="Korzinka Supermarket" />
          <field-errors [field]="clientForm.name" />
        </div>

        <div class="field">
          <label for="company">Company</label>
          <input id="company" [formField]="clientForm.company" placeholder="Korzinka LLC" />
          <field-errors [field]="clientForm.company" />
        </div>

        <div class="field">
          <label for="phone">Phone</label>
          <input id="phone" [formField]="clientForm.phone" placeholder="+998901112233" />
          <field-errors [field]="clientForm.phone" />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" [formField]="clientForm.email" />
          <field-errors [field]="clientForm.email" />
        </div>

        <div class="field full">
          <label for="address">Address</label>
          <input id="address" [formField]="clientForm.address" />
          <field-errors [field]="clientForm.address" />
        </div>

        <div class="field">
          <label for="isActive">Status</label>
          <label class="checkbox">
            <input id="isActive" type="checkbox" [formField]="clientForm.isActive" />
            <span>Active client</span>
          </label>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn" [disabled]="clientForm().submitting()">
          {{ clientForm().submitting() ? 'Saving…' : isEdit() ? 'Save changes' : 'Create client' }}
        </button>
        <button type="button" class="btn ghost" (click)="cancel()">Cancel</button>
      </div>
    </form>
  }
</div>
